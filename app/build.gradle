plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rajesh.floatprompter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rajesh.floatprompter'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
